# Perfil DEMO: base de datos H2 en memoria, sin necesidad de MySQL.
# Uso: mvnw spring-boot:run -Dspring-boot.run.profiles=demo
# Los datos se borran al detener el servidor.
spring.datasource.url=jdbc:h2:mem:kukin_demo;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop

# Si no hay JWT_SECRET definido, se genera uno aleatorio al arrancar (solo para demo)
kukin.jwt.allow-random-secret=true
