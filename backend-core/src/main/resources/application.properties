server.port=8080

# Importar variables desde .env local (opcional para no fallar en producción)
spring.config.import=optional:file:.env[.properties]

# Conexión a MySQL local 
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/kukin_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Nombres de campo en snake_case y fechas ISO 8601 
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC

# Seguridad JWT (Expira en 60 minutos)
kukin.jwt.secret=${JWT_SECRET:}
kukin.jwt.expiration-seconds=3600

# Integración con Spoonacular API
kukin.spoonacular.api-key=${SPOONACULAR_API_KEY:}
kukin.spoonacular.base-url=https://api.spoonacular.com

# Orígenes permitidos (CORS): navegador de desarrollo + app móvil (Capacitor Android/iOS)
kukin.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost,https://localhost,capacitor://localhost}

# Solo el perfil demo/pruebas puede arrancar sin JWT_SECRET (genera uno aleatorio)
kukin.jwt.allow-random-secret=false
